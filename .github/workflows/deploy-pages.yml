# Deploy Pages (SPEC §18) — active. Builds docs/ (VitePress) and syncs the
# output into On0n0k1/On0n0k1.github.io's sites/projects/aquilifer/, served
# at on0n0k1.github.io/projects/aquilifer/. Fires on every push to main, so
# a merge there goes live automatically — a deliberate choice made once the
# project was ready to be shown publicly (see SPEC.md §18/§19 for the
# readiness check this followed).
#
# Requires the PAGES_DEPLOY_TOKEN secret: a fine-grained PAT scoped to only
# On0n0k1/On0n0k1.github.io with Contents: Read & write (see SPEC.md §18
# for why it's its own token, not reused elsewhere).

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: aquilifer
      BUILD_OUTPUT_DIR: docs/.vitepress/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

      - name: Clone On0n0k1.github.io
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/On0n0k1/On0n0k1.github.io.git "$RUNNER_TEMP/pages-repo"

      - name: Sync built site into sites/projects/$PROJECT_NAME
        run: |
          PAGES_REPO="$RUNNER_TEMP/pages-repo"
          rm -rf "$PAGES_REPO/sites/projects/$PROJECT_NAME"
          mkdir -p "$PAGES_REPO/sites/projects/$PROJECT_NAME"
          cp -r "$BUILD_OUTPUT_DIR"/. "$PAGES_REPO/sites/projects/$PROJECT_NAME/"

      - name: Commit and push
        run: |
          cd "$RUNNER_TEMP/pages-repo"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy."
            exit 0
          fi
          git commit -m "deploy: sync $PROJECT_NAME from ${{ github.repository }}@${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected, retrying with rebase ($i)..."
            git pull --rebase
          done
          echo "Push failed after retries" >&2
          exit 1
