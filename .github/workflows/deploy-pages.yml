#
# The docs site itself is implemented (docs/, VitePress) and builds cleanly
# (`npm run build` inside docs/). This workflow is still inert because it
# should only ever deploy when the project is ready to be shown publicly —
# not automatically on every push, which is what an uncommented version of
# this would otherwise do the moment it's added.
#
# To activate when that day comes:
#   1. Uncomment everything below.
#   2. Add a `PAGES_DEPLOY_TOKEN` secret to this repo — a fine-grained PAT
#      scoped to only On0n0k1/On0n0k1.github.io with Contents: Read & write
#      (see SPEC.md §18 for why it's its own token, not reused elsewhere).
#      Already done once, as of this writing — check it's still valid
#      before relying on it if a lot of time has passed.
#   3. Decide the trigger deliberately — `workflow_dispatch` (manual only)
#      keeps deploys a conscious action even after uncommenting everything
#      else; adding the `push: branches: [main]` trigger back makes every
#      merge to main go live immediately, which is the behavior to avoid
#      until the project is meant to be public.
